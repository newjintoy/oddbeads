<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장바구니와 주문 — ODDBEADS</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#20201e;font-family:Helvetica,Arial,'Apple SD Gothic Neo',sans-serif}a{color:inherit;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;margin:0 5%;height:90px;border-bottom:1px solid}.logo{font-size:27px;font-weight:800;letter-spacing:-1.5px}header a:last-child{font-size:13px}main{margin:55px 5%}h1{font-size:42px;letter-spacing:-1.5px}.steps{font-size:11px;letter-spacing:2px;color:#777}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:45px}.item{border-top:1px solid #c7c2b8;padding:25px 0}.item h2{font-size:21px}.meta{font-size:12px;color:#6e695f;line-height:1.9}.beads{display:flex;flex-wrap:wrap;gap:2px;margin:15px 0}.beads img{width:30px;height:30px;object-fit:contain}.item-bottom{display:flex;justify-content:space-between;align-items:center}.quantity{display:flex;gap:15px;align-items:center}button{font:inherit;cursor:pointer;border:1px solid #aaa69b;background:none;padding:8px 13px;border-radius:24px;font-size:12px}.remove{border:0;text-decoration:underline}.summary{padding:28px;background:#eae6dd;align-self:start;position:sticky;top:25px}.summary h2{font-size:20px;margin-top:0}.row{display:flex;justify-content:space-between;margin:18px 0;font-size:13px}.total{font-size:20px;border-top:1px solid #c8c1b4;padding-top:20px}p{font-size:12px;line-height:1.9}.note{color:#777}.primary{background:#20201e;color:white;width:100%;padding:15px;margin-top:15px;border-color:#20201e}.disabled{opacity:.5;cursor:default}.empty{padding:60px 0;font-size:15px}.detail{border:1px solid #c5beb1;padding:20px;margin-top:20px}footer{margin:80px 5% 20px;font-size:11px}.toast{font-size:12px;color:#a43c24;min-height:25px}@media(max-width:800px){.layout{grid-template-columns:1fr}.summary{position:static}h1{font-size:34px}}button:focus-visible,a:focus-visible{outline:2px solid #f03c27;outline-offset:4px}</style></head><body><header><a class="logo" href="home.html">oddbeads✳</a><a href="custom.html">← 커스텀 계속하기</a></header><main><div class="steps">01 DESIGN → 02 CART → 03 ORDER REVIEW</div><h1>내가 고른 조각들</h1><div class="layout"><section id="cart-items"></section><aside class="summary"><h2>주문 예상 금액</h2><div class="row"><span>상품 합계</span><strong id="subtotal"></strong></div><div class="row"><span>배송비</span><span>정책 확정 후 안내</span></div><div class="row total"><span>예상 상품 금액</span><strong id="total"></strong></div><p class="note">기본 제작가 + 비즈별 제안 단가로 계산한 금액이야<br>배송비와 비즈 판매가는 아직 확정 전이야</p><button class="primary" id="review">주문 내용 확인</button><div id="review-box" hidden class="detail"><strong>주문 내용 확인</strong><p id="review-copy"></p><button id="download">조합 주문서 다운로드</button><p class="note">아직 실제 주문 접수나 결제는 진행되지 않았어<br>결제 서비스 연결 후 구매할 수 있어</p><button class="primary disabled" disabled>결제 연결 준비 중</button></div><p class="toast" id="message" role="status"></p></aside></div></main><footer>ODDBEADS · 조금 다르게, 완전히 나답게</footer><script src="checkout.js"></script></body></html>
